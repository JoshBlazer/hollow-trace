<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Source for all app icons: regenerate with `npx tauri icon app-icon.svg` -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#03210c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- Sweep wedge: bright at the leading edge, fading behind it -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blipGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="disc"><circle cx="512" cy="512" r="400"/></clipPath>
  </defs>

  <!-- Background tile -->
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="none" stroke="#00ff41" stroke-opacity="0.35" stroke-width="8"/>

  <!-- Sweep wedge (≈60°, leading edge pointing up-right) -->
  <g clip-path="url(#disc)">
    <path d="M512 512 L512 112 A400 400 0 0 1 858.4 312 Z" fill="url(#sweep)" transform="rotate(-20 512 512)"/>
  </g>

  <!-- Rings and crosshair -->
  <g fill="none" stroke="#00ff41" filter="url(#glow)">
    <circle cx="512" cy="512" r="400" stroke-width="28"/>
    <circle cx="512" cy="512" r="260" stroke-width="18" stroke-opacity="0.6"/>
    <circle cx="512" cy="512" r="120" stroke-width="14" stroke-opacity="0.45"/>
    <line x1="512" y1="140" x2="512" y2="884" stroke-width="8" stroke-opacity="0.3"/>
    <line x1="140" y1="512" x2="884" y2="512" stroke-width="8" stroke-opacity="0.3"/>
  </g>

  <!-- Sweep line -->
  <line x1="512" y1="512" x2="777" y2="212" stroke="#00ff41" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="30" fill="#00ff41" filter="url(#glow)"/>

  <!-- Anomaly blip -->
  <circle cx="688" cy="664" r="58" fill="none" stroke="#ff0055" stroke-width="14" stroke-opacity="0.5"/>
  <circle cx="688" cy="664" r="40" fill="#ff0055" filter="url(#blipGlow)"/>
</svg>
