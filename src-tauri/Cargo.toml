[package]
name = "hollow-trace"
version = "0.2.0"
description = "Desktop forensics tool for cybersecurity analysts"
authors = ["Hollow Trace"]
edition = "2021"

[lib]
name = "hollow_trace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log    = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde               = { version = "1.0", features = ["derive"] }
serde_json          = "1.0"
chrono              = { version = "0.4", features = ["serde"] }
regex               = "1.12"
once_cell           = "1.21"
anyhow              = "1.0"
thiserror           = "2.0"
log                 = "0.4"
parking_lot         = "0.12"
notify-debouncer-mini = "0.7"
notify               = "8"
flate2               = "1"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
